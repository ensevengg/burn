name: burn-events release

# Builds what a machine needs to report to burn, so users need neither a Rust
# toolchain nor Bun nor a checkout: the D2 exporter (burn-events) and a
# standalone burn-report, attached to the `burn-events-v*` release together
# with SHA256SUMS. scripts/install.sh downloads the matching pair.
# Other targets build from source: cargo install --path crates/burn-events.
on:
  push:
    tags: ["burn-events-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: burn-events.exe
            artifact: burn-events-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            exe: burn-events
            artifact: burn-events-x86_64-unknown-linux-gnu
          - os: macos-latest
            exe: burn-events
            artifact: burn-events-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: crates/burn-events
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Stage binary
        shell: bash
        run: cp "target/release/${{ matrix.exe }}" "../../../${{ matrix.artifact }}"
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "../../../${{ matrix.artifact }}" --clobber --repo "${GITHUB_REPOSITORY}"

  # burn-report as one self-contained executable per platform (Bun
  # cross-compiles from a single runner). Targets mirror the exporter's.
  reporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Build standalone burn-report
        run: |
          mkdir dist
          for target in linux-x64 windows-x64 darwin-arm64; do
            bun build --compile --minify --target="bun-${target}" apps/reporter/src/index.ts --outfile "dist/burn-report-${target}"
          done
          ls -la dist
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

  checksums:
    needs: [build, reporter]
    runs-on: ubuntu-latest
    steps:
      - name: Publish SHA256SUMS for every release binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern 'burn-*'
          sha256sum burn-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber --repo "${GITHUB_REPOSITORY}"
