name: release

# One tag, one release, everything a user installs: scripts/release.sh bumps
# the version and pushes `v<version>`; this checks it, builds the exporter
# and burn-report for each platform and the Android APK, and publishes them
# together with both installers and SHA256SUMS. Nothing is published unless
# every job passed, so `releases/latest/download/<file>` is always a
# complete, matching set. Run it by hand (Actions → release → Run workflow)
# to build everything without publishing.
#
# APK signing, once: create a keystore and store it as repository secrets.
#   keytool -genkeypair -v -keystore burn-release.jks -alias burn \
#     -keyalg RSA -keysize 4096 -validity 36500
#   base64 -w0 burn-release.jks | gh secret set ANDROID_KEYSTORE_BASE64
#   gh secret set ANDROID_KEYSTORE_PASSWORD
#   gh secret set ANDROID_KEY_ALIAS        # burn
#   gh secret set ANDROID_KEY_PASSWORD
# Keep the keystore safe: Android installs an update only when it is signed
# with the same key as the installed app.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Tag matches every version field
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || version=""
          bun scripts/release-version.ts check $version
      - run: bun run typecheck
      - run: bun run test

  exporter:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            exe: burn-events.exe
            artifact: burn-events-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            exe: burn-events
            artifact: burn-events-x86_64-unknown-linux-gnu
          - os: macos-latest
            exe: burn-events
            artifact: burn-events-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/burn-events
      - name: Build
        working-directory: crates/burn-events
        run: cargo build --release --locked
      - name: Stage
        shell: bash
        run: mkdir out && cp "crates/burn-events/target/release/${{ matrix.exe }}" "out/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  # burn-report as one self-contained executable per platform; Bun
  # cross-compiles from a single runner. Targets mirror the exporter's.
  reporter:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Build standalone burn-report
        run: |
          mkdir out
          for target in linux-x64 windows-x64 darwin-arm64; do
            bun build --compile --minify --target="bun-${target}" apps/reporter/src/index.ts --outfile "out/burn-report-${target}"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: burn-report
          path: out/*
          if-no-files-found: error

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - name: Generate the Android project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --no-install --clean
      - name: Decode the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; see the comment at the top of release.yml"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/burn-release.jks"
      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          BURN_KEYSTORE: ${{ runner.temp }}/burn-release.jks
          BURN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BURN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BURN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NODE_ENV: production
        # 64-bit ARM only: every Android 8+ phone in use, a fraction of the size.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Stage
        run: |
          mkdir out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/burn.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: burn.apk
          path: out/burn.apk
          if-no-files-found: error

  publish:
    needs: [exporter, reporter, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect and checksum
        run: |
          mkdir release
          cp artifacts/* scripts/install.sh scripts/install.ps1 release/
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # A manual run never publishes, even when started on a tag.
      - name: Keep a manual run's build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: release/*
      - name: Publish
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "burn ${GITHUB_REF_NAME}" \
            --generate-notes
